# Производственный режим: API + интерфейс в одном контейнере, данные в PostgreSQL.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: flagman
      POSTGRES_USER: flagman
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flagman}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flagman"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      Database__Provider: postgres
      ConnectionStrings__Postgres: Host=db;Port=5432;Database=flagman;Username=flagman;Password=${POSTGRES_PASSWORD:-flagman}
      Demo__AllowReset: "false"
      Demo__SeedOnStart: "false"
      # ID администраторов для входа, например ADMIN_IDS="1001:Иван Петров,1002".
      Auth__AdminIds: ${ADMIN_IDS:?Задайте ADMIN_IDS — ID администраторов для входа}
    ports:
      - "8080:8080"

volumes:
  pgdata:
