# Render Blueprint: Dashboard → New → Blueprint → выбрать этот репозиторий.
services:
  - type: web
    name: flagman-warehouse
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Демо-режим: SQLite внутри контейнера, при каждом запуске база заполняется свежей демо-историей.
      - key: Database__Provider
        value: sqlite
      - key: Demo__SeedOnStart
        value: "true"
      - key: Demo__AllowReset
        value: "true"
      # ID администраторов для входа: «1001:Иван Петров, 1002». Значение задаётся в панели Render
      # (Environment), в репозиторий не попадает.
      - key: Auth__AdminIds
        sync: false
